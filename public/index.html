<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="NERO Tube — discover and watch videos.">
  <title>NERO Tube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="NERO Tube home"><span class="brand-mark"><i data-lucide="play-square"></i></span><strong>NERO</strong><span class="brand-sub">Tube</span><span class="brand-credit">made by beans.jusfine</span></a>
    <form id="search-form" class="search"><input id="query" autocomplete="off" placeholder="Search videos" aria-label="Search videos"><button aria-label="Search"><i data-lucide="search"></i></button></form>
    <button id="settings-toggle" class="icon-btn" aria-label="Provider settings" title="Settings"><i data-lucide="sliders-horizontal"></i></button>
  </header>
  <div id="settings" class="settings" hidden><div><strong>Video sources</strong><span id="provider-status">Discovering public instances…</span></div><p>NERO Tube searches public Invidious instances first and falls back to Piped. Public instances can occasionally be unavailable.</p></div>
  <div class="layout">
    <aside class="sidebar">
      <button class="nav-item active" data-page="home"><svg class="youtube-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#ff0033" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/><path fill="#fff" d="m9.6 15.8 6.2-3.8-6.2-3.8z"/></svg> Home</button>
      <button class="nav-item" data-page="shorts"><i data-lucide="clapperboard"></i> Shorts</button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-page="saved"><i data-lucide="bookmark"></i> Saved</button>
      <button class="nav-item" data-page="history"><i data-lucide="history"></i> History</button>
      <div class="sidebar-foot">NERO <span>Beyond the ordinary.</span></div>
    </aside>
    <main>
      <div class="chips" id="chips">
        <button class="chip selected" data-query="popular videos">All</button>
        <button class="chip" data-query="music videos">Music</button>
        <button class="chip" data-query="gaming">Gaming</button>
        <button class="chip" data-query="technology">Technology</button>
        <button class="chip" data-query="animation">Animation</button>
        <button class="chip" data-query="news">News</button>
        <button class="chip" data-query="memes">Memes</button>
      </div>
      <div class="feed-head"><h1 id="page-title">Explore</h1><span id="status" role="status">Loading videos…</span></div>
      <section id="grid" class="video-grid" aria-live="polite"></section>
      <button id="load-more" class="load-more" hidden>Load more</button>
    </main>
  </div>
  <div id="player" class="player" hidden>
    <div class="player-panel">
      <div class="player-head"><div><strong id="player-title">Now playing</strong><span id="player-source"></span></div><button id="close-player" class="close-btn" aria-label="Close player"><i data-lucide="x"></i></button></div>
      <div id="stage" class="stage"></div>
      <div class="player-actions"><button id="share-video"><i data-lucide="share-2"></i> Share video</button><button id="save-current"><i data-lucide="bookmark-plus"></i> Save video</button></div>
    </div>
  </div>
  <script src="/app.js" defer></script>
<script>window.addEventListener("DOMContentLoaded",()=>window.lucide?.createIcons());</script>
</body>
</html>
